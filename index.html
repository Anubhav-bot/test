<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina LMS · Course Catalog</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">Lumina LMS</a>
        <nav class="nav" id="main-nav"></nav>
        <div class="auth-actions" id="auth-actions"></div>
      </div>
    </header>

    <main>
      <div class="container">
        <section class="hero minimal-hero" id="hero-section">
          <div class="stack">
            <p class="hero-kicker">Welcome to Lumina LMS</p>
            <h1 class="section-title">Learn quickly with focused, professional courses.</h1>
            <p class="subtle line-clamp-2">
              Short video units, automatic progress tracking, and free enrollment.
            </p>
            <div class="card-actions" id="hero-actions"></div>
            <div class="hero-stats" id="hero-stats"></div>
          </div>
        </section>

        <section class="section section-card">
          <div class="section-header">
            <h2 class="section-title">Course catalog</h2>
            <span class="subtle" id="course-count"></span>
          </div>
          <div class="grid" id="course-grid"></div>
          <div id="course-empty"></div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container">Lumina LMS · Free, professional learning for modern teams.</div>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/catalog.js"></script>
  </body>
</html>
