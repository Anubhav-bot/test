<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina LMS · Admin</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">Lumina LMS</a>
        <nav class="nav" id="main-nav"></nav>
        <div class="auth-actions" id="auth-actions"></div>
      </div>
    </header>

    <main>
      <div class="container">
        <div id="page-message"></div>
        <section class="hero">
          <div>
            <p class="badge">Admin console</p>
            <h1 class="section-title">Manage courses & units</h1>
            <p class="subtle">Create new learning experiences or update existing content.</p>
          </div>
          <div class="hero-card">
            <h2 class="section-title">Create a course</h2>
            <form class="form" id="create-course-form">
              <input name="title" placeholder="Course title" required />
              <textarea name="description" placeholder="Course description" required></textarea>
              <input
                name="thumbnailUrl"
                placeholder="Thumbnail image URL"
                required
              />
              <button class="button" type="submit">Create course</button>
            </form>
          </div>
        </section>

        <section class="section section-card">
          <div class="section-header">
            <h2 class="section-title">Your courses</h2>
          </div>
          <div id="admin-course-list" class="list"></div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container">Admin access · Changes are saved locally.</div>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
  </body>
</html>
