<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina LMS · Dashboard</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="container header-inner">
        <a class="logo" href="index.html">Lumina LMS</a>
        <nav class="nav" id="main-nav"></nav>
        <div class="auth-actions" id="auth-actions"></div>
      </div>
    </header>

    <main>
      <div class="container">
        <div id="page-message"></div>
        <section class="hero" id="dashboard-hero"></section>

        <section class="section section-card">
          <div class="section-header">
            <h2 class="section-title">Enrolled courses</h2>
          </div>
          <div class="grid" id="enrolled-courses"></div>
          <div id="enrolled-empty"></div>
        </section>
      </div>
    </main>

    <footer class="footer">
      <div class="container">Your learning progress, all in one place.</div>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/app.js"></script>
    <script src="js/dashboard.js"></script>
  </body>
</html>
